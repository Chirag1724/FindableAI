name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test-lint:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Mypy Type Checker
        run: mypy app

      - name: Run Pytest Suite
        env:
          ENVIRONMENT: "test"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          GROQ_API_KEY: "dummy_ci_key"
          DEFAULT_LLM_MODEL: "groq/qwen/qwen3.8-27b"
          # Explicit: CI has no worker process; allow in-process claim after enqueue
          # when a disposable DB is available. Default remains false for production.
          SCAN_JOB_INLINE_FALLBACK: "true"
        run: pytest -v
