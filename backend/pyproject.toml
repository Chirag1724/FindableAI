[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, variables, etc.)
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear
    "UP",   # pyupgrade (modern Python syntax)
    "ASYNC",# async best practices
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # do not perform function calls in argument defaults (needed for FastAPI Depends)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["venv", "\\.venv"]

# pytest-asyncio 0.24+/1.x defaults to strict mode: async fixtures must use
# ``@pytest_asyncio.fixture`` (not bare ``@pytest.fixture``). Keep that mode
# explicit so unit and PG integration tests share one supported configuration.
[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
