services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: findable-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-findable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-findable_secret}
      POSTGRES_DB: ${POSTGRES_DB:-findable_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-findable} -d ${POSTGRES_DB:-findable_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: findable-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: findable-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      # Pass through from host .env. Empty is allowed for compose interpolation
      # (so `docker compose up -d postgres` works); the app refuses to start in
      # ENVIRONMENT=production when API_KEY is empty (assert_production_security_config).
      API_KEY: ${API_KEY:-}
      ALLOW_SYNTHETIC_DEMO: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-findable}:${POSTGRES_PASSWORD:-findable_secret}@postgres:5432/${POSTGRES_DB:-findable_db}
      REDIS_URL: redis://redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      HEAVY_LLM_MODEL: ${HEAVY_LLM_MODEL:-groq/openai/gpt-oss-120b}
      FAST_LLM_MODEL: ${FAST_LLM_MODEL:-groq/openai/gpt-oss-20b}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-groq/openai/gpt-oss-120b}
      FALLBACK_LLM_MODEL: ${FALLBACK_LLM_MODEL:-groq/openai/gpt-oss-120b}
      LLM_BUDGET_CAP_USD: ${LLM_BUDGET_CAP_USD:-0.01}
      LLM_ESTIMATED_USD_PER_CALL: ${LLM_ESTIMATED_USD_PER_CALL:-0.0001}
      LLM_ENFORCE_USD_BUDGET: ${LLM_ENFORCE_USD_BUDGET:-true}
      MAX_LLM_CALLS_PER_SCAN: ${MAX_LLM_CALLS_PER_SCAN:-60}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DURABLE_SCAN_JOBS: "true"
      SCAN_JOB_INLINE_FALLBACK: "false"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: findable-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      API_KEY: ${API_KEY:-}
      ALLOW_SYNTHETIC_DEMO: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-findable}:${POSTGRES_PASSWORD:-findable_secret}@postgres:5432/${POSTGRES_DB:-findable_db}
      REDIS_URL: redis://redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      HEAVY_LLM_MODEL: ${HEAVY_LLM_MODEL:-groq/openai/gpt-oss-120b}
      FAST_LLM_MODEL: ${FAST_LLM_MODEL:-groq/openai/gpt-oss-20b}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-groq/openai/gpt-oss-120b}
      FALLBACK_LLM_MODEL: ${FALLBACK_LLM_MODEL:-groq/openai/gpt-oss-120b}
      LLM_BUDGET_CAP_USD: ${LLM_BUDGET_CAP_USD:-0.01}
      LLM_ESTIMATED_USD_PER_CALL: ${LLM_ESTIMATED_USD_PER_CALL:-0.0001}
      LLM_ENFORCE_USD_BUDGET: ${LLM_ENFORCE_USD_BUDGET:-true}
      MAX_LLM_CALLS_PER_SCAN: ${MAX_LLM_CALLS_PER_SCAN:-60}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      DURABLE_SCAN_JOBS: "true"
      SCAN_JOB_INLINE_FALLBACK: "false"
      SCAN_JOB_POLL_INTERVAL_SECONDS: "2"
      SCAN_JOB_LEASE_SECONDS: "600"
      SCAN_JOB_MAX_ATTEMPTS: "3"
    # Worker image still runs migrations in the default CMD; override to the job loop.
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import app.jobs.worker; print('ok')\""]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: findable-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
